    <circle cx="-14" cy="-52" r="2.2" fill="#ff8fa3" fill-opacity=".55"/>
    <circle cx="16" cy="-52" r="2.2" fill="#ff8fa3" fill-opacity=".55"/>
    <!-- antena -->
    <rect x="-4" y="-84" width="8" height="7" fill="#2E7D3A"/>
    <rect x="-6" y="-88" width="12" height="4" rx="1" fill="#FFC93C"/>
