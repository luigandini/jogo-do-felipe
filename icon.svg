    <circle cx="49" cy="-67" r="9" fill="#e53935"/>
    <circle cx="51" cy="-70" r="3.4" fill="#ff7961"/>
    <rect x="42" y="-62" width="10" height="4" rx="1.5" fill="#fff" transform="rotate(-30 47 -60)"/>
