    </g>
    <!-- mochila -->
    <rect x="-24" y="-40" width="10" height="20" rx="5" fill="#6b7a6e"/>
    <!-- corpo -->
    <rect x="-18" y="-42" width="36" height="28" rx="7" fill="#2E7D3A"/>
    <circle cx="0" cy="-28" r="6" fill="#FFC93C"/>
    <circle cx="-2" cy="-30" r="2" fill="#fff" fill-opacity=".5"/>
    <!-- braço de mola acenando -->
    <polyline points="16,-34 22,-41 26,-38 31,-47 35,-44 40,-54 44,-52 47,-62"
