<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a6bd1"/>
      <stop offset="0.55" stop-color="#143a7a"/>
      <stop offset="1" stop-color="#0b1d3a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE27A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE27A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- estrelas -->
  <g fill="#fff">
    <circle cx="70" cy="80" r="4"/><circle cx="120" cy="150" r="2.5"/><circle cx="430" cy="70" r="3"/>
    <circle cx="460" cy="190" r="2.5"/><circle cx="60" cy="260" r="3"/><circle cx="200" cy="50" r="2"/>
    <circle cx="350" cy="120" r="2"/><circle cx="455" cy="330" r="3"/>
  </g>
  <path d="M95 345 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#FFE27A"/>
  <!-- chão / ilha -->
  <ellipse cx="256" cy="520" rx="330" ry="70" fill="#F2D27A"/>
  <ellipse cx="256" cy="512" rx="330" ry="55" fill="#E8C060"/>
  <!-- brilho atrás do robô -->
  <circle cx="240" cy="270" r="190" fill="url(#glow)"/>

  <!-- ZIPO (mesmas formas do jogo, escala 4.4) -->
