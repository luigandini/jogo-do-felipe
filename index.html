let W = 960, H = 540, scale = 1, dpr = 1, offX = 0, offY = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  H = 540;
  W = Math.max(760, Math.min(1280, Math.round(540 * w / h)));
  scale = h / H;
  if (W * scale > w) scale = w / W;
  offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}

let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(f, d, type, f2, vol) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, AC.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + d);
    g.gain.setValueAtTime(vol || 0.08, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}

let musicKey = null, musicStep = 0, nextNoteT = 0;
function mfreq(n) { return 440 * Math.pow(2, (n - 69) / 12); }
function tone(f, at, d, type, vol) {
  try { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, at); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0005, at + d); o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at + d + 0.02); } catch (e) {}
}
function desiredMusic() {
  if (save.mute) return null;
  if (state === 'title' || state === 'map') return 'map';
  if (state === 'opening') return 'opening';
  if (state === 'ending' || state === 'credits') return 'ending';
  if (state === 'win') return null;
  if (state === 'intro') return 'beach';
  if (bossOn) return 'boss';
  if (chaseOn) return 'chase';
  return L ? L.theme : null;
}
function musicTick() {
  if (!AC) return;
  const k = desiredMusic();
  if (k !== musicKey) { musicKey = k; musicStep = 0; nextNoteT = AC.currentTime + 0.08; }
  if (!musicKey || paused) return;
  const m = MUSIC[musicKey], step = 60 / m.bpm / 2;
  if (nextNoteT < AC.currentTime - 0.5) nextNoteT = AC.currentTime + 0.05;
  while (nextNoteT < AC.currentTime + 0.12) {
    const i = musicStep % m.lead.length, n = m.lead[i], b = m.bass[Math.floor(musicStep / 2) % m.bass.length];
    if (n) tone(mfreq(n), nextNoteT, step * 0.9, 'square', 0.022);
    if (b && musicStep % 2 === 0) tone(mfreq(b), nextNoteT, step * 1.8, 'triangle', 0.05);
    nextNoteT += step; musicStep++;
  }
}

    if (d.st === 'bite') {

      else {
