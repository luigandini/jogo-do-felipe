<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1d3a">
<title>Zipo e a Nave Perdida</title>
<style>
html,body{margin:0;height:100%;background:#0b1d3a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0b1d3a;color:#fff;font:700 22px system-ui,sans-serif;text-align:center;padding:24px;gap:18px;z-index:5}
#rot .ph{width:60px;height:100px;border:5px solid #7CE38B;border-radius:12px;animation:r 1.6s ease-in-out infinite}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph"></div>Vire o celular de lado<br>para jogar com o Zipo!</div>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 960, H = 540, scale = 1, dpr = 1, offX = 0, offY = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  H = 540;
  W = Math.max(760, Math.min(1280, Math.round(540 * w / h)));
  scale = h / H;
  if (W * scale > w) scale = w / W;
  offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}
addEventListener('resize', resize); resize();

// ---------- som ----------
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(f, d, type, f2) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, AC.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + d);
    g.gain.setValueAtTime(0.08, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const SFX = {
  jump: () => beep(380, .15, 'square', 700),
  arm: () => beep(900, .1, 'sawtooth', 400),
  grab: () => beep(600, .08, 'square', 900),
  got: () => { beep(660, .1, 'square'); setTimeout(() => beep(880, .1, 'square'), 100); setTimeout(() => beep(1320, .2, 'square'), 200); },
  splash: () => beep(300, .3, 'triangle', 80),
  boing: () => beep(200, .2, 'triangle', 500),
  ouch: () => beep(220, .15, 'sawtooth', 120),
  boom: () => beep(120, .6, 'sawtooth', 30)
};

// ---------- fase: praia ----------
const LEVEL_W = 3500, SEA_Y = 472;
const solids = [
  { x: -300, y: 460, w: 1000, h: 200, k: 'sand' },
  { x: 1000, y: 460, w: 600, h: 200, k: 'sand' },
  { x: 1300, y: 300, w: 300, h: 160, k: 'rock' },
  { x: 1600, y: 460, w: 600, h: 200, k: 'sand' },
  { x: 2600, y: 460, w: 250, h: 200, k: 'sand' },
  { x: 2950, y: 460, w: 700, h: 200, k: 'sand' },
  { x: 3440, y: 200, w: 200, h: 260, k: 'rock' }
];
const anchors = [
  { x: 850, y: 230, t: 'hook' },
  { x: 1304, y: 304, t: 'ledge', dir: 1 },
  { x: 1596, y: 304, t: 'ledge', dir: -1 },
  { x: 2330, y: 215, t: 'hook' },
  { x: 2480, y: 215, t: 'hook' }
];
const checkpoints = [120, 1060, 1660, 2640, 2990];
const palms = [60, 520, 1150, 1850, 2100, 2700, 3150];
let pieces, crabs;
function resetLevel() {
  pieces = [
    { id: 1, name: 'Propulsor', type: 'prop', x: 1500, y: 262, got: false, pulled: false },
    { id: 2, name: 'Painel Solar', type: 'panel', x: 2405, y: 330, got: false, pulled: false },
    { id: 3, name: 'Motor', type: 'gear', x: 2900, y: 515, got: false, pulled: false, water: true }
  ];
  crabs = [
    { x: 1100, min: 1040, max: 1260, dir: 1, stun: 0 },
    { x: 1900, min: 1780, max: 2120, dir: -1, stun: 0 },
    { x: 3100, min: 3000, max: 3380, dir: 1, stun: 0 }
  ];
}

// ---------- jogador ----------
const P = { x: 200, y: 300, w: 40, h: 66, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, hurt: 0, inv: 0, climb: null, expr: 'ok', exprT: 0, wheel: 0, lastCP: 120 };
let rope = null, arm = { st: 'idle' };
const RANGE = 300, G = 1800;
function shoulder() { return { x: P.x + P.w / 2 + P.face * 10, y: P.y + 40 }; }
function restHand() { const s = shoulder(); return { x: s.x + P.face * 14, y: s.y + 6 }; }

// ---------- entrada ----------
const keys = {};
let jumpHeldKey = false;
addEventListener('keydown', e => {
  initAudio();
  if (e.repeat) return;
  keys[e.code] = true;
  if (state !== 'play') { tapAdvance(); return; }
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) pressJump();
  if (['KeyX', 'KeyJ', 'KeyK', 'ShiftLeft', 'ShiftRight'].includes(e.code)) pressArm();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const pointers = new Map();
function btnDefs() {
  return {
    left: { x: 85, y: H - 85, r: 52 },
    right: { x: 205, y: H - 85, r: 52 },
    arm: { x: W - 225, y: H - 72, r: 54 },
    jump: { x: W - 92, y: H - 110, r: 60 }
  };
}
function toV(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
function hitBtn(p) {
  const b = btnDefs(); let best = null, bd = 1e9;
  for (const k in b) { const d = Math.hypot(p.x - b[k].x, p.y - b[k].y); if (d < b[k].r * 1.35 && d < bd) { bd = d; best = k; } }
  return best;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (state !== 'play') { tapAdvance(); return; }
  const p = toV(e);
  if (p.x > W - 70 && p.y < 70) { paused = !paused; return; }
  if (paused) { paused = false; return; }
  const b = hitBtn(p); pointers.set(e.pointerId, b);
  if (b === 'jump') pressJump();
  if (b === 'arm') pressArm();
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const cur = pointers.get(e.pointerId);
  if (cur === 'left' || cur === 'right' || cur === null) { const b = hitBtn(toV(e)); if (b === 'left' || b === 'right') pointers.set(e.pointerId, b); }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, e => pointers.delete(e.pointerId)));
function held(name) {
  for (const v of pointers.values()) if (v === name) return true;
  if (name === 'left') return keys.ArrowLeft || keys.KeyA;
  if (name === 'right') return keys.ArrowRight || keys.KeyD;
  if (name === 'jump') return keys.Space || keys.ArrowUp || keys.KeyW;
  return false;
}
document.addEventListener('contextmenu', e => e.preventDefault());

function pressJump() {
  if (P.climb) return;
  if (rope) { releaseRope(); P.vy = Math.min(P.vy, -480); SFX.jump(); return; }
  if (P.hurt > 0) return;
  if (P.onGround || P.coyote > 0) { P.vy = -660; P.onGround = false; P.coyote = 0; SFX.jump(); puff(P.x + P.w / 2, P.y + P.h, 6, '#f6e3b0'); }
}
function pressArm() {
  if (P.climb) return;
  let from = null;
  if (rope) { from = rope.a; releaseRope(); }
  else if (arm.st !== 'idle') return;
  const s = shoulder(); let best = null, bd = 1e9;
  const goDir = from ? (Math.abs(P.vx) > 40 ? Math.sign(P.vx) : P.face) : P.face;
  for (const p of pieces) {
    if (p.got || p.pulled) continue;
    const dx = p.x - s.x, dy = p.y - s.y, d = Math.hypot(dx, dy);
    if (d < 210 && dx * P.face > -50 && d - 1000 < bd && los(s.x, s.y, p.x, p.y)) { best = { k: 'piece', o: p }; bd = d - 1000; }
  }
  for (const a of anchors) {
    if (a === from) continue;
    if (from && (a.x - from.x) * goDir <= 0) continue;
    const dx = a.x - s.x, dy = a.y - s.y, d = Math.hypot(dx, dy);
    if (d < RANGE && dy < 30 && dx * P.face > -40 && d < bd && los(s.x, s.y, a.x, a.y)) { best = { k: 'anchor', o: a }; bd = d; }
  }
  if (from && !best) return;
  SFX.arm();
  if (best) arm = { st: 'out', t: 0, dur: 0.13, tx: best.o.x, ty: best.o.y, target: best };
  else arm = { st: 'out', t: 0, dur: 0.15, tx: s.x + P.face * RANGE * 0.7, ty: s.y - RANGE * 0.45, target: null };
}
function los(x1, y1, x2, y2) {
  for (let t = 0.05; t <= 0.85; t += 0.05) {
    const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    for (const s of solids) if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return false;
  }
  return true;
}
function releaseRope() {
  if (!rope) return;
  if (rope.a.t === 'hook') {
    const d = Math.abs(P.vx) > 60 ? Math.sign(P.vx) : P.face;
    P.vx = d * Math.max(Math.abs(P.vx), 340); P.vy = Math.min(P.vy, -460); P.face = d;
  }
  arm = { st: 'back', t: 0, dur: 0.12, fx: rope.a.x, fy: rope.a.y };
  rope = null;
}

// ---------- partículas e mensagens ----------
let parts = [], shake = 0, toast = null, bubble = null;
function puff(x, y, n, col, sp) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * (sp || 160), vy: -Math.random() * (sp || 160), life: .5 + Math.random() * .4, max: .9, col, r: 3 + Math.random() * 4 });
}
function sparkle(x, y, n) {
  const cols = ['#FFD84D', '#FFFFFF', '#7CE38B', '#7FD6FF'];
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 80 + Math.random() * 240; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .7 + Math.random() * .5, max: 1.2, col: cols[i % 4], r: 3 + Math.random() * 3, star: true }); }
}
function say(text, dur) { bubble = { text, t: dur || 2.5 }; }

// ---------- estado ----------
let state = 'title', stateT = 0, paused = false, camX = 0, time = 0, collected = 0, introDone = false, wreckShown = false;
let seenHint = {};
function startIntro() {
  resetLevel(); collected = 0; P.x = 200; P.y = -200; P.vx = 0; P.vy = 0; P.face = 1; rope = null; arm = { st: 'idle' };
  P.lastCP = 120; camX = 0; state = 'intro'; stateT = 0; parts = []; wreckShown = false; introDone = false; bubble = null; toast = null;
  try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {}); } catch (e) {}
}
function tapAdvance() {
  if (state === 'title') startIntro();
  else if (state === 'intro') { if (stateT > 0.4) beginPlay(); }
  else if (state === 'win') { if (stateT > 1.2) { state = 'title'; stateT = 0; } }
}
function beginPlay() {
  wreckShown = true; state = 'play'; stateT = 0;
  P.x = 200; P.y = 460 - P.h; P.vx = 0; P.vy = 0; P.onGround = true;
  say('Oh não! As peças da minha nave se espalharam pela ilha!', 3.5);
}

// ---------- física ----------
function overlap(a, s) { return a.x < s.x + s.w && a.x + a.w > s.x && a.y < s.y + s.h && a.y + a.h > s.y; }
function moveX(dx) {
  P.x += dx;
  for (const s of solids) if (overlap(P, s)) { if (dx > 0) P.x = s.x - P.w; else if (dx < 0) P.x = s.x + s.w; P.vx = 0; }
}
function moveY(dy) {
  P.y += dy;
  for (const s of solids) if (overlap(P, s)) {
    if (dy > 0) { P.y = s.y - P.h; P.onGround = true; } else if (dy < 0) P.y = s.y + s.h;
    P.vy = 0;
  }
}
function pushOut() {
  for (const s of solids) if (overlap(P, s)) {
    const l = P.x + P.w - s.x, r = s.x + s.w - P.x, u = P.y + P.h - s.y, d = s.y + s.h - P.y;
    const m = Math.min(l, r, u, d);
    if (m === u) { P.y -= u; if (P.vy > 0) P.vy = 0; P.onGround = true; }
    else if (m === d) { P.y += d; if (P.vy < 0) P.vy = 0; }
    else if (m === l) { P.x -= l; if (P.vx > 0) P.vx = 0; }
    else { P.x += r; if (P.vx < 0) P.vx = 0; }
  }
}

function update(dt) {
  time += dt; stateT += dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.star ? 200 : 500) * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 20);
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }

  if (state === 'intro') { updateIntro(dt); return; }
  if (state !== 'play' || paused) return;

  updateCrabs(dt);
  P.exprT -= dt; if (P.exprT <= 0) P.expr = 'ok';
  if (P.hurt > 0) P.hurt -= dt;
  if (P.inv > 0) P.inv -= dt;

  // subindo na beirada
  if (P.climb) {
    const c = P.climb; c.t += dt; const k = Math.min(1, c.t / c.dur), e = k * k * (3 - 2 * k);
    P.x = c.fx + (c.tx - c.fx) * e; P.y = c.fy + (c.ty - c.fy) * e - Math.sin(k * Math.PI) * 24;
    if (k >= 1) { P.climb = null; P.vx = 0; P.vy = 0; P.onGround = true; P.expr = 'happy'; P.exprT = 1; }
    updateArm(dt); updatePieces(dt); updateCamera(dt); return;
  }

  const dir = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  if (dir !== 0) P.face = dir;
  if (rope) {
    P.vy += G * dt; P.vx += dir * 900 * dt; P.vx *= (1 - 0.1 * dt);
    if (rope.a.t === 'ledge') rope.len = Math.max(30, rope.len - 300 * dt);
    else if (rope.len > 165) rope.len = Math.max(165, rope.len - 220 * dt);
  } else if (P.hurt <= 0) {
    const target = dir * 270, k = P.onGround ? 14 : 6;
    P.vx += (target - P.vx) * Math.min(1, dt * k);
    P.vy += G * dt;
  } else { P.vy += G * dt; }
  P.vy = Math.min(P.vy, 1100);
  const wasGround = P.onGround; P.onGround = false;
  moveX(P.vx * dt); moveY(P.vy * dt);

  if (rope) {
    const s = shoulder(), dx = s.x - rope.a.x, dy = s.y - rope.a.y, d = Math.hypot(dx, dy);
    if (d > rope.len) {
      const nx = dx / d, ny = dy / d, ex = d - rope.len;
      P.x -= nx * ex; P.y -= ny * ex;
      const vr = P.vx * nx + P.vy * ny;
      if (vr > 0) { P.vx -= vr * nx; P.vy -= vr * ny; }
    }
    pushOut();
    if (rope.a.t === 'ledge' && d < 75) {
      const a = rope.a;
      P.climb = { t: 0, dur: 0.35, fx: P.x, fy: P.y, tx: a.dir > 0 ? a.x + 6 : a.x - P.w - 6, ty: a.y - 4 - P.h };
      P.face = a.dir; rope = null; arm = { st: 'back', t: 0, dur: 0.1, fx: a.x, fy: a.y }; SFX.boing();
    }
  }
  if (P.x < 0) { P.x = 0; P.vx = Math.max(0, P.vx); }
  if (P.onGround) { P.coyote = 0.1; if (!wasGround && P.vy >= 0) puff(P.x + P.w / 2, P.y + P.h, 4, '#f6e3b0', 90); }
  else P.coyote -= dt;
  P.wheel += P.vx * dt * 0.08;

  if (P.onGround) for (const c of checkpoints) if (P.x > c - 40 && c > P.lastCP) P.lastCP = c;

  // caiu na água
  if (P.y > 620) {
    SFX.splash(); puff(P.x + P.w / 2, SEA_Y, 18, '#bfe9ff', 260);
    rope = null; arm = { st: 'idle' };
    P.x = P.lastCP; P.y = 460 - P.h - 40; P.vx = 0; P.vy = 0; P.expr = 'surprise'; P.exprT = 1.2;
    say(['Ufa! Robô não gosta de água!', 'Quase! Tenta de novo!', 'Brrr, que água gelada!'][Math.floor(Math.random() * 3)], 2);
  }
  updateArm(dt); updatePieces(dt); updateCamera(dt);
}
function updateCamera(dt) {
  const tgt = Math.max(0, Math.min(LEVEL_W - W, P.x - W * 0.38));
  camX += (tgt - camX) * Math.min(1, dt * 6);
}
function updateArm(dt) {
  if (arm.st === 'out') {
    arm.t += dt;
    if (arm.t >= arm.dur) {
      const tg = arm.target;
      if (tg && tg.k === 'anchor') {
        const s = shoulder();
        rope = { a: tg.o, len: Math.hypot(s.x - tg.o.x, s.y - tg.o.y) };
        if (tg.o.t === 'hook') { P.vx = P.face * Math.max(Math.abs(P.vx), 420); P.vy = Math.min(P.vy, -120); }
        arm = { st: 'hold' }; SFX.grab(); P.expr = 'happy'; P.exprT = .6;
        if (tg.o.t === 'hook' && !seenHint.release) { seenHint.release = true; }
      } else if (tg && tg.k === 'piece') {
        tg.o.pulled = true; arm = { st: 'pull', piece: tg.o }; SFX.grab();
        if (tg.o.water) puff(tg.o.x, SEA_Y, 14, '#bfe9ff', 200);
      } else arm = { st: 'back', t: 0, dur: 0.12, fx: arm.tx, fy: arm.ty };
    }
  } else if (arm.st === 'back') { arm.t += dt; if (arm.t >= arm.dur) arm = { st: 'idle' }; }
  else if (arm.st === 'hold' && !rope) arm = { st: 'idle' };
}
function handPos() {
  const s = shoulder(), r = restHand();
  if (arm.st === 'out') { const k = Math.min(1, arm.t / arm.dur); return { x: s.x + (arm.tx - s.x) * k, y: s.y + (arm.ty - s.y) * k }; }
  if (arm.st === 'back') { const k = Math.min(1, arm.t / arm.dur); return { x: arm.fx + (r.x - arm.fx) * k, y: arm.fy + (r.y - arm.fy) * k }; }
  if (arm.st === 'hold' && rope) return { x: rope.a.x, y: rope.a.y };
  if (arm.st === 'pull') return { x: arm.piece.x, y: arm.piece.y };
  return r;
}
function updatePieces(dt) {
  const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
  for (const p of pieces) {
    if (p.got) continue;
    if (p.pulled) {
      const r = restHand(), dx = r.x - p.x, dy = r.y - p.y, d = Math.hypot(dx, dy), sp = 650 * dt;
      if (d < 26) collect(p); else { p.x += dx / d * Math.min(sp, d); p.y += dy / d * Math.min(sp, d); }
    } else if (!p.water && Math.hypot(p.x - cx, p.y - cy) < 46) collect(p);
  }
}
function collect(p) {
  p.got = true; p.pulled = false; collected++;
  if (arm.st === 'pull') arm = { st: 'idle' };
  SFX.got(); sparkle(p.x, p.y, 30); P.expr = 'happy'; P.exprT = 2;
  toast = { text: 'Peça encontrada: ' + p.name + '!', sub: collected + ' de 3', t: 2.6 };
  if (collected >= 3) setTimeout(() => { state = 'win'; stateT = 0; SFX.got(); }, 1600);
}
function updateCrabs(dt) {
  for (const c of crabs) {
    if (c.stun > 0) { c.stun -= dt; continue; }
    c.x += c.dir * 70 * dt;
    if (c.x < c.min) { c.x = c.min; c.dir = 1; } if (c.x > c.max) { c.x = c.max; c.dir = -1; }
    const box = { x: c.x - 22, y: 460 - 26, w: 44, h: 26 };
    if (!P.climb && overlap(P, box)) {
      if (P.vy > 80 && P.y + P.h - box.y < 22) { P.vy = -520; c.stun = 3; SFX.boing(); puff(c.x, box.y, 8, '#ffd0c0'); P.expr = 'happy'; P.exprT = 1; }
      else if (P.hurt <= 0 && P.inv <= 0) {
        P.inv = 1.4;
        const sgn = P.x + P.w / 2 < c.x ? -1 : 1; P.vx = sgn * 380; P.vy = -380; P.hurt = 0.45;
        rope = null; if (arm.st === 'hold') arm = { st: 'idle' };
        SFX.ouch(); P.expr = 'surprise'; P.exprT = 1; say('Ai! Caranguejo bravo!', 1.4);
      }
    }
  }
}

// ---------- abertura (nave caindo) ----------
const intro = { ship: { x: 0, y: 0 }, flying: [] };
function updateIntro(dt) {
  const t = stateT;
  if (t < 1.7) {
    const k = t / 1.7;
    intro.ship.x = W + 120 + (260 - W - 120) * k; intro.ship.y = 40 + 380 * k * k;

  if (x > 2700 && x < 2850 && !pieces[2].got) return 'A peça está na água! Use o BRAÇO para puxar!';
  return '';
}
function drawWorld() {
  drawSky();
  ctx.save(); ctx.translate(-camX, 0);
  for (const x of palms) if (x > camX - 120 && x < camX + W + 60) drawPalm(x);
  ctx.restore();
  drawSea();
  ctx.save(); ctx.translate(-camX, 0);
  if (pieces && pieces[2] && pieces[2].water && !pieces[2].got && !pieces[2].pulled) drawPiece(pieces[2]);
  drawWater();
  drawSolids();
  if (wreckShown) drawWreck(150);
  drawAnchors();
  if (pieces) for (const p of pieces) if (!p.got && !(p.water && !p.pulled)) drawPiece(p);
  if (crabs) for (const c of crabs) if (c.x > camX - 60 && c.x < camX + W + 60) drawCrab(c);
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col;
    if (p.star) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(time * 4); ctx.fillRect(-p.r, -p.r / 3, p.r * 2, p.r / 1.5); ctx.fillRect(-p.r / 3, -p.r, p.r / 1.5, p.r * 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function title(text, y, size, col, stroke) {
  ctx.font = '900 ' + size + 'px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size / 6; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(text, W / 2, y); }
  ctx.fillStyle = col; ctx.fillText(text, W / 2, y);
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#0b1d3a'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx * scale), dpr * (offY + sy * scale));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  if (state === 'title') {
    camX = (Math.sin(time * 0.1) * 0.5 + 0.5) * 600;
    if (!pieces) resetLevel();
    drawWorld(); ctx.restore();
    ctx.fillStyle = 'rgba(11,29,58,.35)'; ctx.fillRect(0, 0, W, H);
    title('ZIPO', H / 2 - 120, 110, '#7CE38B', '#123B1C');
    title('e a Nave Perdida', H / 2 - 40, 40, '#FFC93C', '#5a3d00');
    drawZipo(W / 2 - 20, H / 2 + 52 + Math.sin(time * 3) * 6, 1, Math.floor(time) % 4 === 0 ? 'happy' : 'ok', time * 2, 1.4);
    if (Math.floor(time * 2) % 2 === 0) title('Toque para começar', H - 62, 28, '#fff', '#123B1C');
    ctx.font = '700 14px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.textAlign = 'center'; ctx.fillText('Versão de teste 1  •  Um jogo criado pelo Felipe', W / 2, H - 26);
  } else if (state === 'intro') {
    drawWorld();
    if (stateT > 2.2) drawZipo(P.x, P.y, 1, P.expr, 0);
    ctx.restore();
    drawParts();
    if (stateT < 1.7) {
      const s = intro.ship; ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(-0.5 + Math.sin(time * 30) * 0.08);
      ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.moveTo(70, -8); ctx.lineTo(110 + Math.random() * 20, 0); ctx.lineTo(70, 8); ctx.fill();
      ctx.fillStyle = '#c7d0d9'; ctx.beginPath(); ctx.ellipse(0, 0, 75, 26, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#5fd0ff'; ctx.beginPath(); ctx.ellipse(-25, -10, 22, 13, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#9aa6b2'; ctx.beginPath(); ctx.moveTo(40, -10); ctx.lineTo(70, -40); ctx.lineTo(55, -8); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#FFD84D'; for (const f of intro.flying) { ctx.beginPath(); ctx.arc(f.x, f.y, 8, 0, 7); ctx.fill(); }
    if (stateT > 0.4) { ctx.font = '700 14px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.textAlign = 'right'; ctx.fillText('toque para pular a cena', W - 18, H - 18); }
  } else {
    drawWorld();
    drawPlayer();
    if (state !== 'win') drawParts();
    ctx.restore();
    drawBubble();
    if (state === 'play') { drawButtons(); drawHUD(); }
    if (state === 'win') {
      ctx.fillStyle = 'rgba(11,29,58,.72)'; ctx.fillRect(0, 0, W, H);
      title('VOCÊ CONSEGUIU!', H / 2 - 130, 56, '#FFC93C', '#5a3d00');
      ctx.fillStyle = '#fff'; ctx.font = '700 22px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('O Zipo achou as 3 peças da praia:', W / 2, H / 2 - 66);
      ctx.fillText('Propulsor, Painel Solar e Motor', W / 2, H / 2 - 36);
      drawZipo(W / 2 - 20, H / 2 + 4 + Math.abs(Math.sin(time * 5)) * -24, 1, 'happy', time * 3, 1.2);
      ctx.fillStyle = '#7CE38B'; ctx.font = '800 22px system-ui,sans-serif';
      ctx.fillText('Próxima área: Floresta dos Dinossauros (em breve!)', W / 2, H / 2 + 110);
      if (stateT > 1.2 && Math.floor(time * 2) % 2 === 0) { ctx.fillStyle = '#fff'; ctx.font = '700 18px system-ui,sans-serif'; ctx.fillText('Toque para jogar de novo', W / 2, H - 34); }
      if (Math.random() < 0.3) sparkle(Math.random() * W, Math.random() * H * 0.5, 3);
      drawParts();
    }
  }
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
resetLevel();
requestAnimationFrame(loop);
window.__game = { P, get state() { return state; }, get rope() { return rope; }, get pieces() { return pieces; }, pressArm, pressJump, keys, startIntro, beginPlay, update };
</script>
