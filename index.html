<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1d3a">
<title>Zipo e a Nave Perdida</title>
<style>
html,body{margin:0;height:100%;background:#0b1d3a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0b1d3a;color:#fff;font:700 22px system-ui,sans-serif;text-align:center;padding:24px;gap:18px;z-index:5}
#rot .ph{width:60px;height:100px;border:5px solid #7CE38B;border-radius:12px;animation:r 1.6s ease-in-out infinite}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph"></div>Vire o celular de lado<br>para jogar com o Zipo!</div>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 960, H = 540, scale = 1, dpr = 1, offX = 0, offY = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  H = 540;
  W = Math.max(760, Math.min(1280, Math.round(540 * w / h)));
  scale = h / H;
  if (W * scale > w) scale = w / W;
  offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}
addEventListener('resize', resize); resize();

// ---------- progresso salvo ----------
let save = { area: 2 };
try { const s = JSON.parse(localStorage.getItem('zipo_save') || '{}'); if (s.area) save.area = s.area; } catch (e) {}
function unlock(a) { if (a > save.area) { save.area = a; try { localStorage.setItem('zipo_save', JSON.stringify(save)); } catch (e) {} } }

// ---------- som ----------
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function beep(f, d, type, f2, vol) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, AC.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + d);
    g.gain.setValueAtTime(vol || 0.08, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const SFX = {
  jump: () => beep(380, .15, 'square', 700),
  arm: () => beep(900, .1, 'sawtooth', 400),
  grab: () => beep(600, .08, 'square', 900),
  got: () => { beep(660, .1, 'square'); setTimeout(() => beep(880, .1, 'square'), 100); setTimeout(() => beep(1320, .2, 'square'), 200); },
  splash: () => beep(300, .3, 'triangle', 80),
  boing: () => beep(200, .2, 'triangle', 500),
  ouch: () => beep(220, .15, 'sawtooth', 120),
  boom: () => beep(120, .6, 'sawtooth', 30),
  snap: () => beep(500, .15, 'sawtooth', 90),
  screech: () => beep(1400, .35, 'sawtooth', 700, .05),
  stomp: () => beep(90, .25, 'triangle', 50, .12),
  roar: () => { beep(110, .9, 'sawtooth', 60, .12); beep(160, .9, 'square', 70, .05); },
  rawr: () => beep(700, .25, 'square', 1100, .06),
  chomp: () => { beep(300, .06, 'square'); setTimeout(() => beep(300, .06, 'square'), 120); }
};

// ---------- fases ----------
const GROUND = 460, SEA_Y = 472;
function makePraia() {
  return {
    id: 1, name: 'Área 1: A Praia', theme: 'beach', W: 3500, next: 'Floresta dos Dinossauros',
    solids: [
      { x: -300, y: 460, w: 1000, h: 200, k: 'sand' },
      { x: 1000, y: 460, w: 600, h: 200, k: 'sand' },
      { x: 1300, y: 300, w: 300, h: 160, k: 'rock' },
      { x: 1600, y: 460, w: 600, h: 200, k: 'sand' },
      { x: 2600, y: 460, w: 250, h: 200, k: 'sand' },
      { x: 2950, y: 460, w: 700, h: 200, k: 'sand' },
      { x: 3440, y: 200, w: 200, h: 260, k: 'rock' }
    ],
    anchors: [
      { x: 850, y: 230, t: 'hook' },
      { x: 1304, y: 304, t: 'ledge', dir: 1 },
      { x: 1596, y: 304, t: 'ledge', dir: -1 },
      { x: 2330, y: 215, t: 'hook' },
      { x: 2480, y: 215, t: 'hook' }
    ],
    checkpoints: [120, 1060, 1660, 2640, 2990],
    deco: [60, 520, 1150, 1850, 2100, 2700, 3150],
    pools: [{ x: 2846, w: 108 }],
    pieces: [
      { id: 1, name: 'Propulsor', type: 'prop', x: 1500, y: 262 },
      { id: 2, name: 'Painel Solar', type: 'panel', x: 2405, y: 330 },
      { id: 3, name: 'Motor', type: 'gear', x: 2900, y: 515, water: true }
    ],
    crabs: [
      { x: 1100, min: 1040, max: 1260, dir: 1, stun: 0 },
      { x: 1900, min: 1780, max: 2120, dir: -1, stun: 0 },
      { x: 3100, min: 3000, max: 3380, dir: 1, stun: 0 }
    ],
    trikes: [], pteros: [], knots: [], wreck: true
  };
}
function makeFloresta() {
  return {
    id: 2, name: 'Área 2: Floresta dos Dinossauros', theme: 'forest', W: 5440, next: 'O Vulcão',
    solids: [
      { x: -300, y: 460, w: 1000, h: 200, k: 'dirt' },
      { x: 1300, y: 460, w: 700, h: 200, k: 'dirt' },
      { x: 1820, y: 340, w: 180, h: 120, k: 'rock' },
      { x: 2700, y: 460, w: 1100, h: 200, k: 'dirt' },
      { x: 3270, y: 330, w: 56, h: 130, k: 'thorn', thorn: true },
      { x: 3640, y: 420, w: 70, h: 40, k: 'log' },
      { x: 4100, y: 460, w: 400, h: 200, k: 'dirt' },
      { x: 4290, y: 420, w: 70, h: 40, k: 'log' },
      { x: 4900, y: 460, w: 700, h: 200, k: 'dirt' },
      { x: 5380, y: 140, w: 200, h: 320, k: 'rock' }
    ],
    anchors: [
      { x: 820, y: 205, t: 'hook' },
      { x: 985, y: 195, t: 'hook' },
      { x: 1150, y: 205, t: 'hook' },
      { x: 1822, y: 344, t: 'ledge', dir: 1 },
      { x: 1998, y: 344, t: 'ledge', dir: -1 },
      { x: 2140, y: 200, t: 'hook', move: { amp: 45, sp: 1.5 } },
      { x: 2335, y: 190, t: 'hook', breaks: true },
      { x: 2535, y: 200, t: 'hook', move: { amp: 50, sp: 2.0 } },
      { x: 3880, y: 205, t: 'hook' },
      { x: 4030, y: 195, t: 'hook' },
      { x: 4610, y: 200, t: 'hook' },
      { x: 4790, y: 200, t: 'hook', breaks: true }
    ],
    checkpoints: [120, 1320, 2720, 3440, 4120, 4920],
    deco: [80, 420, 1400, 1650, 2800, 3500, 4200, 5000, 5250],
    pools: [],
    pieces: [
      { id: 4, name: 'Antena', type: 'antenna', x: 1930, y: 305 },
      { id: 5, name: 'Escudo', type: 'shield', x: 3170, y: 405, hidden: true },
      { id: 6, name: 'Asa da Nave', type: 'wing', x: 5000, y: 380 }
    ],
    crabs: [],
    trikes: [{ x: 1560, min: 1360, max: 1700, dir: 1, st: 'walk', t: 0 }],
    pteros: [{ x: 2300, y0: 105, y: 105, min: 2040, max: 2660, dir: 1, st: 'fly', t: 0 }],
    knots: [{ x: 3040, y: 392, got: false }],
    dente: { x: 3115, st: 'trapped' },
    chase: { startX: 3440, edgeLeap: [3800, 4100], stopX: 4500 },
    wreck: false
  };
}
const MAKERS = { 1: makePraia, 2: makeFloresta };

let L = null;
function loadLevel(n) {
  L = MAKERS[n]();
  for (const p of L.pieces) { p.got = false; p.pulled = false; }
  for (const a of L.anchors) { a.bx = a.x; a.broken = 0; }
  trex = null; chaseOn = false; caught = 0;
  collected = 0;
}

// ---------- jogador ----------
const P = { x: 200, y: 300, w: 40, h: 66, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, hurt: 0, inv: 0, climb: null, expr: 'ok', exprT: 0, wheel: 0, lastCP: 120 };
let rope = null, arm = { st: 'idle' };
const RANGE = 300, PULL = 210, G = 1800;
function shoulder() { return { x: P.x + P.w / 2 + P.face * 10, y: P.y + 40 }; }
function restHand() { const s = shoulder(); return { x: s.x + P.face * 14, y: s.y + 6 }; }

// ---------- entrada ----------
const keys = {};
addEventListener('keydown', e => {
  initAudio();
  if (e.repeat) return;
  keys[e.code] = true;
  if (state !== 'play') {
    if (state === 'title' && save.area >= 2) { if (e.code === 'Digit1') return startArea(1); if (e.code === 'Digit2') return startArea(2); }
    tapAdvance(null); return;
  }
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) pressJump();
  if (['KeyX', 'KeyJ', 'KeyK', 'ShiftLeft', 'ShiftRight'].includes(e.code)) pressArm();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const pointers = new Map();
function btnDefs() {
  return {
    left: { x: 85, y: H - 85, r: 52 },
    right: { x: 205, y: H - 85, r: 52 },
    arm: { x: W - 225, y: H - 72, r: 54 },
    jump: { x: W - 92, y: H - 110, r: 60 }
  };
}
function toV(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
function hitBtn(p) {
  const b = btnDefs(); let best = null, bd = 1e9;
  for (const k in b) { const d = Math.hypot(p.x - b[k].x, p.y - b[k].y); if (d < b[k].r * 1.35 && d < bd) { bd = d; best = k; } }
  return best;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const p = toV(e);
  if (state !== 'play') { tapAdvance(p); return; }
  if (p.x > W - 70 && p.y < 70) { paused = !paused; return; }
  if (paused) { if (p.y > H / 2 + 50 && p.y < H / 2 + 110 && Math.abs(p.x - W / 2) < 130) { paused = false; state = 'title'; stateT = 0; return; } paused = false; return; }
  const b = hitBtn(p); pointers.set(e.pointerId, b);
  if (b === 'jump') pressJump();
  if (b === 'arm') pressArm();
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const cur = pointers.get(e.pointerId);
  if (cur === 'left' || cur === 'right' || cur === null) { const b = hitBtn(toV(e)); if (b === 'left' || b === 'right') pointers.set(e.pointerId, b); }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, e => pointers.delete(e.pointerId)));
function held(name) {
  for (const v of pointers.values()) if (v === name) return true;
  if (name === 'left') return keys.ArrowLeft || keys.KeyA;
  if (name === 'right') return keys.ArrowRight || keys.KeyD;
  if (name === 'jump') return keys.Space || keys.ArrowUp || keys.KeyW;
  return false;
}
document.addEventListener('contextmenu', e => e.preventDefault());

function pressJump() {
  if (P.climb || caught > 0) return;
  if (rope) { releaseRope(); P.vy = Math.min(P.vy, -480); SFX.jump(); return; }
  if (P.hurt > 0) return;
  if (P.onGround || P.coyote > 0) { P.vy = -660; P.onGround = false; P.coyote = 0; SFX.jump(); puff(P.x + P.w / 2, P.y + P.h, 6, dustCol()); }
}
function anchorOk(a) { return !a.broken; }
function pressArm() {
  if (P.climb || caught > 0) return;
  let from = null;
  if (rope) { from = rope.a; releaseRope(); }
  else if (arm.st !== 'idle') return;
  const s = shoulder(); let best = null, bd = 1e9;
  const goDir = from ? (Math.abs(P.vx) > 40 ? Math.sign(P.vx) : P.face) : P.face;
  for (const p of L.pieces) {
    if (p.got || p.pulled || p.hidden) continue;
    const dx = p.x - s.x, dy = p.y - s.y, d = Math.hypot(dx, dy);
    if (d < PULL && dx * P.face > -50 && d - 1000 < bd && los(s.x, s.y, p.x, p.y)) { best = { k: 'piece', o: p }; bd = d - 1000; }
  }
  for (const k of L.knots) {
    if (k.got) continue;
    const dx = k.x - s.x, dy = k.y - s.y, d = Math.hypot(dx, dy);
    if (d < PULL && dx * P.face > -50 && d - 1000 < bd) { best = { k: 'knot', o: k }; bd = d - 1000; }
  }
  for (const a of L.anchors) {
    if (a === from || !anchorOk(a)) continue;
    if (from && (a.x - from.x) * goDir <= 0) continue;
    const dx = a.x - s.x, dy = a.y - s.y, d = Math.hypot(dx, dy);
    if (d < RANGE && dy < 30 && dx * P.face > -40 && d < bd && los(s.x, s.y, a.x, a.y)) { best = { k: 'anchor', o: a }; bd = d; }
  }
  if (from && !best) return;
  SFX.arm();
  if (best) arm = { st: 'out', t: 0, dur: 0.13, tx: best.o.x, ty: best.o.y, target: best };
  else arm = { st: 'out', t: 0, dur: 0.15, tx: s.x + P.face * RANGE * 0.7, ty: s.y - RANGE * 0.45, target: null };
}
function los(x1, y1, x2, y2) {
  for (let t = 0.05; t <= 0.85; t += 0.05) {
    const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    for (const s of L.solids) if (!s.gone && x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return false;
  }
  return true;
}
function releaseRope(noBoost) {
  if (!rope) return;
  if (rope.a.t === 'hook' && !noBoost) {
    const d = Math.abs(P.vx) > 60 ? Math.sign(P.vx) : P.face;
    P.vx = d * Math.max(Math.abs(P.vx), 340); P.vy = Math.min(P.vy, -460); P.face = d;
  }
  arm = { st: 'back', t: 0, dur: 0.12, fx: rope.a.x, fy: rope.a.y };
  rope = null;
}

// ---------- partículas e falas ----------
let parts = [], shake = 0, toast = null, talkQ = [], bubble = null;
function dustCol() { return L && L.theme === 'forest' ? '#a07850' : '#f6e3b0'; }
function puff(x, y, n, col, sp) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * (sp || 160), vy: -Math.random() * (sp || 160), life: .5 + Math.random() * .4, max: .9, col, r: 3 + Math.random() * 4 });
}
function sparkle(x, y, n) {
  const cols = ['#FFD84D', '#FFFFFF', '#7CE38B', '#7FD6FF'];
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 80 + Math.random() * 240; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .7 + Math.random() * .5, max: 1.2, col: cols[i % 4], r: 3 + Math.random() * 3, star: true }); }
}
function say(text, dur, who) { talkQ = [{ text, t: dur || 2.5, who: who || 'zipo' }]; bubble = null; }
function talk(list) { talkQ = list.map(l => ({ who: l[0], text: l[1], t: l[2] || 2.6 })); bubble = null; }

// ---------- estado ----------
let state = 'title', stateT = 0, paused = false, camX = 0, time = 0, collected = 0, wreckShown = false;
let trex = null, chaseOn = false, caught = 0;
function startArea(n) {
  loadLevel(n);
  P.vx = 0; P.vy = 0; P.face = 1; rope = null; arm = { st: 'idle' }; P.climb = null; P.inv = 0; P.hurt = 0;
  camX = 0; parts = []; talkQ = []; bubble = null; toast = null;
  try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {}); } catch (e) {}
  if (n === 1) { P.x = 200; P.y = -200; P.lastCP = 120; state = 'intro'; stateT = 0; wreckShown = false; }
  else {
    P.x = 120; P.y = GROUND - P.h; P.lastCP = 120; state = 'play'; stateT = 0; wreckShown = false;
    talk([['zipo', 'Que floresta escura... e cheia de dinossauros!', 2.8], ['zipo', 'Ouvi um chorinho lá na frente. Será que alguém precisa de ajuda?', 3.2]]);
  }
}
function tapAdvance(p) {
  if (state === 'title') {
    if (save.area >= 2) {
      if (!p) return startArea(save.area >= 2 ? 2 : 1);
      const b = titleBtns();
      for (const k of b) if (Math.abs(p.x - k.x) < k.w / 2 && Math.abs(p.y - k.y) < k.h / 2) return startArea(k.n);
      return;
    }
    startArea(1);
  }
  else if (state === 'intro') { if (stateT > 0.4) beginPlay(); }
  else if (state === 'win') {
    if (stateT > 1.2) {
      if (L.id === 1) startArea(2);
      else { state = 'title'; stateT = 0; }
    }
  }
}
function titleBtns() { return [{ n: 1, x: W / 2 - 150, y: H - 92, w: 250, h: 64, label: '1  A Praia' }, { n: 2, x: W / 2 + 150, y: H - 92, w: 250, h: 64, label: '2  A Floresta' }]; }
function beginPlay() {
  wreckShown = true; state = 'play'; stateT = 0;
  P.x = 200; P.y = GROUND - P.h; P.vx = 0; P.vy = 0; P.onGround = true;
  say('Oh não! As peças da minha nave se espalharam pela ilha!', 3.5);
}

// ---------- física ----------
function overlap(a, s) { return a.x < s.x + s.w && a.x + a.w > s.x && a.y < s.y + s.h && a.y + a.h > s.y; }
function moveX(dx) {
  P.x += dx;
  for (const s of L.solids) if (!s.gone && overlap(P, s)) { if (dx > 0) P.x = s.x - P.w; else if (dx < 0) P.x = s.x + s.w; P.vx = 0; }
}
function moveY(dy) {
  P.y += dy;
  for (const s of L.solids) if (!s.gone && overlap(P, s)) {
    if (dy > 0) { P.y = s.y - P.h; P.onGround = true; } else if (dy < 0) P.y = s.y + s.h;
    P.vy = 0;
  }
}
function pushOut() {
  for (const s of L.solids) if (!s.gone && overlap(P, s)) {
    const l = P.x + P.w - s.x, r = s.x + s.w - P.x, u = P.y + P.h - s.y, d = s.y + s.h - P.y;
    const m = Math.min(l, r, u, d);
    if (m === u) { P.y -= u; if (P.vy > 0) P.vy = 0; P.onGround = true; }
    else if (m === d) { P.y += d; if (P.vy < 0) P.vy = 0; }
    else if (m === l) { P.x -= l; if (P.vx > 0) P.vx = 0; }
    else { P.x += r; if (P.vx < 0) P.vx = 0; }
  }
}
function knock(fromX, power) {
  const sgn = P.x + P.w / 2 < fromX ? -1 : 1;
  P.inv = 1.4; P.expr = 'surprise'; P.exprT = 1; SFX.ouch();
  if (rope) { P.vx += sgn * 320; P.vy -= 150; return; }
  P.vx = sgn * (power || 380); P.vy = -380; P.hurt = 0.45;
  if (arm.st === 'hold') arm = { st: 'idle' };
}

function update(dt) {
  time += dt; stateT += dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.star ? 200 : 500) * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 20);
  if (!bubble && talkQ.length) bubble = talkQ.shift();
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }

  if (state === 'intro') { updateIntro(dt); return; }
  if (state !== 'play' || paused) return;

  for (const a of L.anchors) {
    if (a.move) a.x = a.bx + Math.sin(time * a.move.sp) * a.move.amp;
    if (a.broken > 0) { a.broken -= dt; if (a.broken <= 0) a.broken = 0; }
  }
  updateCrabs(dt); updateTrikes(dt); updatePteros(dt); updateDente(dt);
  P.exprT -= dt; if (P.exprT <= 0) P.expr = 'ok';
  if (P.hurt > 0) P.hurt -= dt;
  if (P.inv > 0) P.inv -= dt;

  if (caught > 0) {
    caught -= dt; P.vy += G * dt; P.x += P.vx * dt; P.y += P.vy * dt;
    if (caught <= 0) resetChase();
    updateTrex(dt); updateCamera(dt); return;
  }

  if (P.climb) {
    const c = P.climb; c.t += dt; const k = Math.min(1, c.t / c.dur), e = k * k * (3 - 2 * k);
    P.x = c.fx + (c.tx - c.fx) * e; P.y = c.fy + (c.ty - c.fy) * e - Math.sin(k * Math.PI) * 24;
    if (k >= 1) { P.climb = null; P.vx = 0; P.vy = 0; P.onGround = true; P.expr = 'happy'; P.exprT = 1; }
    updateArm(dt); updatePieces(dt); updateTrex(dt); updateCamera(dt); return;
  }

  const dir = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  if (dir !== 0) P.face = dir;
  if (rope) {
